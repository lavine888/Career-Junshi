<!doctype html><html lang="zh"><meta charset="utf-8"><title>合成官网申请 · DOM验证</title><style>body{font:16px 'Microsoft YaHei';max-width:760px;margin:35px auto}label{display:block;margin:12px}input,textarea,select{display:block;min-width:270px;padding:8px}fieldset{margin:20px}</style><h1>合成产品岗位</h1><form id="application">
<label>姓名<input id="name" name="full_name"></label><label>电子邮箱<input id="email" name="email" type="email"></label><label>联系电话<input id="phone" type="tel" value="本人原有号码"></label>
<fieldset><legend>教育经历一</legend><label>学校<input id="school1"></label><label>专业<input id="major1"></label><label>开始时间<input id="start1" type="month"></label></fieldset>
<fieldset><legend>教育经历二</legend><label>学校<input id="school2"></label><label>开始时间<input id="missing-date" type="date"></label></fieldset>
<label>为什么选择我们公司<textarea id="why"></textarea></label><label>薪资预期<input id="salary"></label><label>签证及工作资格<select id="visa"><option value="">请选择</option><option>无需支持</option></select></label>
<label>验证码<input id="otp" type="password"></label><label>电子邮箱<input id="passport-field" name="passport_number"></label><label>我同意协议<input id="consent" type="checkbox"></label><label>简历附件<input type="file"></label><label>自定义选择<input role="combobox" id="custom"></label><button type="submit">提交申请</button></form><div id="shadow-host"></div>
<script>window.events=[];window.submitted=0;document.addEventListener('input',e=>events.push(e.target.id));document.getElementById('application').onsubmit=e=>{e.preventDefault();submitted++};const root=document.getElementById('shadow-host').attachShadow({mode:'open'});root.innerHTML='<label>GitHub<input id="shadow-github"></label>';</script></html>
